[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wag_toolkit"
version = "0.0.1"
authors = [
  { name="Antonia Langfelder", email="a.langfelder@wellcome.org" },
  { name="Arne Robben", email="a.robben@wellcome.org" },
  { name="Emily Muller", email="e.muller@wellcome.org" },
  { name="Justin Boylan-Toomey", email="j.boylan-toomey@wellcome.org" },

]
description = "Library for working with the Wellcome Academic Graph"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "awswrangler==3.5.2",
    "boto3==1.34.29",
    "neo4j==5.16.0",
    "networkx==3.2.1",
    "numpy==1.26.3",
    "pandas==2.2.0",
    "tqdm==4.66.1"
]

[project.urls]
Homepage = "https://github.com/wellcometrust/wellcome_academic_graph_toolkit"
Issues = "https://github.com/wellcometrust/wellcome_academic_graph_toolkit/issues"
